<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0F2A"/>
      <stop offset="1" stop-color="#3B2A7A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6DF6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- deployment network motif -->
  <g stroke="#8FB0FF" stroke-width="2" opacity="0.45">
    <line x1="960" y1="200" x2="1065" y2="120"/>
    <line x1="960" y1="200" x2="1090" y2="290"/>
    <line x1="960" y1="200" x2="855" y2="300"/>
    <line x1="960" y1="200" x2="880" y2="105"/>
    <line x1="1065" y1="120" x2="880" y2="105"/>
    <line x1="1090" y1="290" x2="855" y2="300"/>
    <line x1="960" y1="200" x2="1010" y2="395"/>
    <line x1="1010" y1="395" x2="1090" y2="290"/>
  </g>
  <g>
    <circle cx="960" cy="200" r="34" fill="#2F6DF6"/>
    <circle cx="960" cy="200" r="48" fill="none" stroke="#2F6DF6" stroke-width="2" opacity="0.6"/>
    <circle cx="1065" cy="120" r="15" fill="#8B5CF6"/>
    <circle cx="1090" cy="290" r="18" fill="#5B8CFF"/>
    <circle cx="855" cy="300" r="14" fill="#8B5CF6"/>
    <circle cx="880" cy="105" r="12" fill="#5B8CFF"/>
    <circle cx="1010" cy="395" r="13" fill="#B79CFF"/>
  </g>
  <text x="905" y="212" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">FDE</text>
  <rect x="0" y="618" width="1200" height="12" fill="url(#accent)" opacity="0.9"/>

  <!-- brand -->
  <circle cx="88" cy="82" r="10" fill="#2F6DF6"/>
  <text x="108" y="93" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">HireSkys</text>
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="4" fill="#A99CFF">CAREER GUIDE · 2026</text>

  <!-- title -->
  <text x="68" y="262" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#FFFFFF">Forward Deployed</text>
  <text x="68" y="348" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#9DB9FF">Engineer Jobs</text>
  <text x="70" y="410" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#CFC8F5">What It Is · Real Salary Data · Skills · Live Openings</text>

  <!-- chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#EAF1FF">
    <rect x="70" y="460" width="205" height="52" rx="26" fill="#FFFFFF" opacity="0.10"/>
    <rect x="70" y="460" width="205" height="52" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="98" y="495">68 Live Jobs</text>
    <rect x="295" y="460" width="245" height="52" rx="26" fill="#FFFFFF" opacity="0.10"/>
    <rect x="295" y="460" width="245" height="52" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="323" y="495">$100K – $280K</text>
    <rect x="560" y="460" width="185" height="52" rx="26" fill="#FFFFFF" opacity="0.10"/>
    <rect x="560" y="460" width="185" height="52" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="588" y="495">US Remote</text>
