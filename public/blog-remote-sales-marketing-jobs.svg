<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1633"/>
      <stop offset="1" stop-color="#14418F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C853"/>
      <stop offset="1" stop-color="#00E5A0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- bar-chart motif -->
  <g opacity="0.14" fill="#FFFFFF">
    <rect x="830" y="380" width="52" height="170"/>
    <rect x="900" y="330" width="52" height="220"/>
    <rect x="970" y="270" width="52" height="280"/>
    <rect x="1040" y="200" width="52" height="350"/>
  </g>
  <g fill="url(#accent)">
    <rect x="830" y="520" width="52" height="30"/>
    <rect x="900" y="500" width="52" height="50"/>
    <rect x="970" y="470" width="52" height="80"/>
    <rect x="1040" y="430" width="52" height="120"/>
  </g>

  <!-- label -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="90" width="250" height="44" rx="22" fill="url(#accent)"/>
    <text x="195" y="119" font-size="22" font-weight="bold" fill="#06281A" text-anchor="middle">LIVE DATA REPORT</text>

    <text x="70" y="235" font-size="72" font-weight="bold" fill="#FFFFFF">Remote Sales &amp;</text>
    <text x="70" y="315" font-size="72" font-weight="bold" fill="#FFFFFF">Marketing Jobs</text>
    <text x="70" y="375" font-size="30" fill="#B9C6E8">3,313 live openings on HireSkys</text>

    <!-- stat chips -->
    <g font-size="24" font-weight="bold">
      <rect x="70" y="430" width="300" height="58" rx="14" fill="#FFFFFF" opacity="0.12"/>
      <text x="90" y="468" fill="#FFFFFF">3,313 Live Openings</text>
      <rect x="390" y="430" width="250" height="58" rx="14" fill="#FFFFFF" opacity="0.12"/>
      <text x="410" y="468" fill="#FFFFFF">90.9% Full-Time</text>
    </g>
    <text x="70" y="560" font-size="26" font-weight="bold" fill="#00E5A0" letter-spacing="4">HIRESKYS</text>
  </g>

  <rect x="0" y="618" width="1200" height="12" fill="url(#accent)"/>
</svg>
