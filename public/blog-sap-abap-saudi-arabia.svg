<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1633"/>
      <stop offset="1" stop-color="#14418F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00C853"/>
      <stop offset="1" stop-color="#00E5A0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- code motif -->
  <g font-family="Consolas, Menlo, monospace" fill="#FFFFFF">
    <text x="905" y="120" font-size="120" opacity="0.07" font-weight="bold">&lt;/&gt;</text>
    <text x="830" y="215" font-size="30" opacity="0.13">REPORT z_hiring.</text>
    <text x="880" y="258" font-size="30" opacity="0.10">DATA: lv_future TYPE string.</text>
    <text x="845" y="301" font-size="30" opacity="0.13">START-OF-SELECTION.</text>
  </g>

  <!-- Riyadh skyline silhouette -->
  <g fill="#FFFFFF" opacity="0.09">
    <rect x="700" y="430" width="52" height="200"/>
    <rect x="762" y="385" width="40" height="245"/>
    <rect x="1010" y="455" width="58" height="175"/>
    <rect x="1078" y="405" width="42" height="225"/>
    <rect x="1130" y="470" width="70" height="160"/>
    <path d="M872,630 L902,235 L938,235 L968,630 L943,630 L920,345 L897,630 Z"/>
    <rect x="640" y="480" width="50" height="150"/>
  </g>
  <rect x="0" y="618" width="1200" height="12" fill="url(#accent)" opacity="0.9"/>

  <!-- brand -->
  <circle cx="88" cy="82" r="10" fill="#2F6DF6"/>
  <text x="108" y="93" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF">HireSkys</text>
  <text x="70" y="150" font-family="Arial, Helvetica, sans-serif" font-size="21" letter-spacing="4" fill="#8FB0FF">CAREER GUIDE · 2026</text>

  <!-- title -->
  <text x="68" y="262" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" fill="#FFFFFF">SAP ABAP Jobs</text>
  <text x="68" y="348" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800" fill="#3DFF9E">in Saudi Arabia</text>
  <text x="70" y="410" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#C4D4F7">Live Openings · SAR Salary Guide · How to Apply</text>

  <!-- chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#EAF1FF">
    <rect x="70" y="460" width="215" height="52" rx="26" fill="#FFFFFF" opacity="0.10"/>
    <rect x="70" y="460" width="215" height="52" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="98" y="495">11 Live Roles</text>
    <rect x="305" y="460" width="255" height="52" rx="26" fill="#FFFFFF" opacity="0.10"/>
    <rect x="305" y="460" width="255" height="52" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="333" y="495">SAR 120K – 280K</text>
    <rect x="580" y="460" width="235" height="52" rx="26" fill="#FFFFFF" opacity="0.10"/>
    <rect x="580" y="460" width="235" height="52" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.35"/>
    <text x="608" y="495">Remote + On-site</text>
  </g>
</svg>
