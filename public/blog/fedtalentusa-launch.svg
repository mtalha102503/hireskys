    <text x="320" y="445" text-anchor="middle" font-size="18" fill="#64748b">Top Contractors</text>

    <rect x="480" y="360" width="240" height="120" rx="12" fill="#ffffff" opacity="0.95"/>
    <text x="600" y="410" text-anchor="middle" font-size="36" font-weight="800" fill="#071228">$554B</text>
    <text x="600" y="445" text-anchor="middle" font-size="18" fill="#64748b">FY2025 Awards</text>

    <rect x="760" y="360" width="240" height="120" rx="12" fill="#ffffff" opacity="0.95"/>
    <text x="880" y="410" text-anchor="middle" font-size="36" font-weight="800" fill="#071228">100%</text>
    <text x="880" y="445" text-anchor="middle" font-size="18" fill="#64748b">Free Forever</text>
