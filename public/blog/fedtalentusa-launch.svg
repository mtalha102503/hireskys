<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="FedTalentUSA launch announcement">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071228"/>
      <stop offset="0.55" stop-color="#12295e"/>
      <stop offset="1" stop-color="#2f6df6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#fbg)" rx="16"/>

  <circle cx="1000" cy="100" r="80" fill="#ffffff" opacity="0.06"/>
  <circle cx="150" cy="520" r="100" fill="#ffffff" opacity="0.05"/>

  <text x="600" y="140" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="600" fill="#93b8f5">HireSkys presents</text>
  <text x="600" y="230" text-anchor="middle" font-family="system-ui, sans-serif" font-size="88" font-weight="800" fill="#ffffff">FedTalent<tspan fill="#93b8f5">USA</tspan></text>
  <text x="600" y="290" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" fill="#e0e7ff">The Federal Contractor Database</text>

  <g font-family="system-ui, sans-serif">
    <rect x="200" y="360" width="240" height="120" rx="12" fill="#ffffff" opacity="0.95"/>
